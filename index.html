<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flowdesk — Gestión de Proyectos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  if (typeof tailwind !== 'undefined') {
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] } } } };
  } else {
    /* cdn.tailwindcss.com no cargó (bloqueador o sin conexión): se usa el CDN de respaldo */
    document.write('<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"><\/script>');
  }
</script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style type="text/tailwindcss">
  @layer components {
    .btn-primary { @apply inline-flex items-center justify-center gap-2 rounded-lg px-3.5 py-2 text-sm font-medium bg-indigo-600 text-white hover:bg-indigo-700 shadow-sm transition focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500/60 disabled:opacity-50; }
    .btn-secondary { @apply inline-flex items-center justify-center gap-2 rounded-lg px-3.5 py-2 text-sm font-medium bg-white text-slate-700 border border-slate-200 hover:bg-slate-50 shadow-sm transition focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500/60; }
    .btn-ghost { @apply inline-flex items-center justify-center gap-2 rounded-lg px-3.5 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 transition focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500/60; }
    .btn-danger { @apply inline-flex items-center justify-center gap-2 rounded-lg px-3.5 py-2 text-sm font-medium bg-red-600 text-white hover:bg-red-700 shadow-sm transition focus:outline-none focus-visible:ring-2 focus-visible:ring-red-500/60; }
    .btn-danger-ghost { @apply inline-flex items-center justify-center gap-2 rounded-lg px-3.5 py-2 text-sm font-medium text-red-600 hover:bg-red-50 transition; }
    .field { @apply w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm text-slate-800 placeholder-slate-400 shadow-sm focus:outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-500/20 transition; }
    .lbl { @apply block text-xs font-semibold text-slate-600 mb-1.5; }
    .nav-item { @apply w-full flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100 transition; }
    .nav-item.active { @apply bg-indigo-50 text-indigo-700; }
  }
</style>
<style>
  html, body { height: 100%; }
  .rail-item { display: flex; flex-direction: column; align-items: center; gap: .25rem; width: 4.25rem; padding: .35rem 0; font-size: 11px; font-weight: 500; color: #475569; border-radius: .5rem; transition: color .15s; }
  .rail-item:hover { color: #0f172a; }
  .rail-ico { width: 2.5rem; height: 2rem; border-radius: .6rem; display: flex; align-items: center; justify-content: center; transition: background .15s; }
  .rail-item:hover .rail-ico { background: #f1f5f9; }
  .rail-item.active { color: #4338ca; }
  .rail-item.active .rail-ico { background: #e0e7ff; }
  body { font-family: 'Inter', system-ui, sans-serif; }
  #sidebar { width: 16.5rem; transition: width .2s ease; }
  #sidebar.collapsed { width: 4.5rem; }
  #sidebar.collapsed .lbl-hide { display: none; }
  #sidebar.collapsed .nav-item, #sidebar.collapsed .proj-item { justify-content: center; }
  .modal-fade { animation: fadeIn .15s ease-out; }
  .modal-pop { animation: popIn .18s ease-out; }
  .popover-pop { animation: popIn .12s ease-out; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes popIn { from { opacity: 0; transform: translateY(6px) scale(.98); } to { opacity: 1; transform: none; } }
  .toast-in { animation: toastIn .25s ease-out; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .drop-hot { outline: 2px dashed #6366f1; outline-offset: -4px; background: rgb(238 242 255 / .8); }
  .dragging { opacity: .45; }
  input[type="date"]::-webkit-calendar-picker-indicator { cursor: pointer; opacity: .6; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: #94a3b8; background-clip: content-box; border: 2px solid transparent; }
  .shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
</style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">

<div id="app" class="h-screen flex flex-col overflow-hidden">

  <!-- Barra superior -->
  <div class="h-14 shrink-0 bg-white border-b border-slate-200 flex items-center gap-3 px-3 sm:px-4 z-30">
    <button type="button" class="flex items-center gap-2.5 pr-2 rounded-lg" data-action="nav" data-view="home" aria-label="Ir al inicio">
      <span class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center text-white shadow-sm"><i data-lucide="layers" class="w-5 h-5"></i></span>
      <span class="hidden sm:block font-bold text-slate-900 tracking-tight">Flowdesk</span>
    </button>
    <div class="flex-1 flex justify-center min-w-0">
      <div class="relative w-full max-w-xl">
        <i data-lucide="search" class="w-4 h-4 text-slate-500 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
        <input id="f-q" type="search" placeholder="Busca lo que quieras…" class="w-full rounded-full bg-slate-100 border border-transparent pl-10 pr-4 py-2 text-sm text-slate-800 placeholder-slate-500 focus:bg-white focus:border-indigo-300 focus:ring-2 focus:ring-indigo-500/20 focus:outline-none transition" autocomplete="off" aria-label="Buscar tareas, proyectos o etiquetas">
      </div>
    </div>
    <div class="flex items-center gap-0.5 sm:gap-1">
      <span id="sync-status" class="hidden items-center gap-2 px-2.5 py-1.5 mr-1 rounded-full bg-slate-100 text-xs font-medium text-slate-600" role="status" aria-live="polite"></span>
      <button type="button" data-action="bell" class="relative p-2 rounded-lg text-slate-600 hover:bg-slate-100" aria-label="Tareas vencidas" title="Tareas vencidas">
        <i data-lucide="bell" class="w-5 h-5"></i>
        <span id="bell-badge" class="hidden absolute top-0 right-0 min-w-[18px] h-[18px] px-1 rounded-full bg-red-500 text-white text-[10px] font-bold items-center justify-center"></span>
      </button>
      <button type="button" data-action="new-member" class="p-2 rounded-lg text-slate-600 hover:bg-slate-100" title="Añadir miembro al equipo" aria-label="Añadir miembro"><i data-lucide="user-plus" class="w-5 h-5"></i></button>
      <button type="button" data-action="help" class="p-2 rounded-lg text-slate-600 hover:bg-slate-100" title="Guía rápida" aria-label="Ayuda"><i data-lucide="circle-help" class="w-5 h-5"></i></button>
      <button type="button" id="user-btn" data-action="user-menu" class="hidden ml-1 rounded-full hover:ring-2 hover:ring-slate-200" aria-label="Mi cuenta"></button>
      <img id="brand-logo" alt="LAgencia" title="LAgencia" class="ml-2 sm:ml-3 h-7 sm:h-9 w-auto object-contain select-none">
    </div>
  </div>

  <div class="flex flex-1 min-h-0">

    <!-- Riel de iconos -->
    <nav id="rail" class="w-[4.75rem] shrink-0 bg-white border-r border-slate-200 flex flex-col items-center py-3 gap-0.5 overflow-y-auto" aria-label="Vistas principales">
      <button type="button" class="rail-item" data-action="nav" data-view="home"><span class="rail-ico"><i data-lucide="layout-grid" class="w-5 h-5"></i></span>Espacio</button>
      <button type="button" class="rail-item" data-action="nav" data-view="projects"><span class="rail-ico"><i data-lucide="folder-kanban" class="w-5 h-5"></i></span>Proyectos</button>
      <div class="w-9 border-t border-slate-200 my-2"></div>
      <button type="button" class="rail-item" data-action="nav" data-view="board"><span class="rail-ico"><i data-lucide="kanban" class="w-5 h-5"></i></span>Tablero</button>
      <button type="button" class="rail-item" data-action="nav" data-view="list"><span class="rail-ico"><i data-lucide="list-checks" class="w-5 h-5"></i></span>Lista</button>
      <button type="button" class="rail-item" data-action="nav" data-view="calendar"><span class="rail-ico"><i data-lucide="calendar-days" class="w-5 h-5"></i></span>Calendario</button>
      <button type="button" class="rail-item" data-action="nav" data-view="log"><span class="rail-ico"><i data-lucide="notebook-pen" class="w-5 h-5"></i></span>Bitácora</button>
      <div class="w-9 border-t border-slate-200 my-2"></div>
      <button type="button" class="rail-item" data-action="nav" data-view="team"><span class="rail-ico"><i data-lucide="users" class="w-5 h-5"></i></span>Equipo</button>
      <div class="flex-1"></div>
      <button type="button" class="rail-item" data-action="export" title="Exportar reporte a Excel"><span class="rail-ico"><i data-lucide="file-spreadsheet" class="w-5 h-5 text-emerald-600"></i></span>Excel</button>
    </nav>

    <!-- Panel del espacio de trabajo -->
    <aside id="panel" class="w-72 shrink-0 bg-slate-50 border-r border-slate-200 flex flex-col min-h-0">
      <div class="px-4 pt-4 pb-2">
        <div class="flex items-center justify-between">
          <span class="text-sm text-slate-600">Espacio de trabajo</span>
          <div class="flex items-center gap-0.5 text-slate-500">
            <button type="button" data-action="panel-menu" class="p-1.5 rounded-md hover:bg-slate-200/70" title="Más opciones" aria-label="Más opciones"><i data-lucide="more-horizontal" class="w-4 h-4"></i></button>
            <button type="button" data-action="panel-search" class="p-1.5 rounded-md hover:bg-slate-200/70" title="Buscar proyecto" aria-label="Buscar en el panel"><i data-lucide="search" class="w-4 h-4"></i></button>
            <button type="button" data-action="toggle-panel" class="p-1.5 rounded-md hover:bg-slate-200/70" title="Ocultar panel" aria-label="Ocultar panel"><i data-lucide="chevrons-left" class="w-4 h-4"></i></button>
          </div>
        </div>
        <div class="mt-3 flex gap-2">
          <button type="button" id="ws-switch" data-action="ws-menu" class="flex-1 min-w-0 flex items-center gap-2.5 rounded-lg border border-slate-300 bg-white px-3 py-2 hover:border-slate-400 text-left transition" aria-label="Cambiar de empresa"></button>
          <button type="button" data-action="new-company" class="w-11 shrink-0 rounded-lg border border-slate-300 bg-white flex items-center justify-center text-slate-600 hover:border-slate-400 hover:text-indigo-600 transition" title="Nueva empresa" aria-label="Nueva empresa"><i data-lucide="plus" class="w-5 h-5"></i></button>
        </div>
      </div>
      <div class="px-4 pt-4 pb-1 flex items-center justify-between">
        <span class="text-sm font-semibold text-slate-800">Contenido</span>
        <div class="flex items-center gap-0.5 text-slate-500">
          <button type="button" data-action="panel-menu" class="p-1.5 rounded-md hover:bg-slate-200/70" title="Más opciones" aria-label="Más opciones de contenido"><i data-lucide="more-horizontal" class="w-4 h-4"></i></button>
          <button type="button" data-action="new-project" class="p-1.5 rounded-md hover:bg-slate-200/70" title="Nuevo proyecto" aria-label="Nuevo proyecto"><i data-lucide="plus" class="w-4 h-4"></i></button>
        </div>
      </div>
      <div id="panel-search-wrap" class="hidden px-4 pb-1"><input id="panel-q" type="search" class="field" placeholder="Buscar proyecto…" autocomplete="off"></div>
      <div id="panel-tree" class="flex-1 overflow-y-auto px-3 py-2 space-y-0.5"></div>
    </aside>

    <!-- Contenido principal -->
    <div class="relative flex-1 min-w-0 flex flex-col bg-white">
      <button type="button" id="panel-expand" data-action="toggle-panel" class="hidden absolute left-3 top-3 z-20 p-2 rounded-lg bg-white border border-slate-200 shadow-sm text-slate-500 hover:text-slate-800" title="Mostrar panel" aria-label="Mostrar panel"><i data-lucide="chevrons-right" class="w-4 h-4"></i></button>

      <header id="view-header" class="bg-white border-b border-slate-200 px-4 sm:px-6 py-3 space-y-3">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div class="min-w-0 pl-9 lg:pl-0 flex items-center gap-4">
            <img id="page-logo" alt="" class="hidden h-9 max-w-[150px] object-contain shrink-0">
            <div class="min-w-0">
              <h1 id="page-title" class="text-xl font-bold text-slate-900 tracking-tight truncate">Tablero</h1>
              <p id="page-sub" class="text-xs text-slate-500 truncate"></p>
            </div>
          </div>
          <div class="flex items-center gap-2 flex-wrap">
            <div id="view-switch"></div>
            <button type="button" class="btn-secondary" data-action="export" title="Descargar tareas en Excel"><i data-lucide="file-spreadsheet" class="w-4 h-4 text-emerald-600"></i><span>Exportar Reporte Excel</span></button>
            <button type="button" class="btn-primary" data-action="new-task"><i data-lucide="plus" class="w-4 h-4"></i><span>Nueva tarea</span></button>
          </div>
        </div>
        <div id="filters-bar" class="flex flex-wrap items-center gap-2">
          <select id="f-project" data-filter="project" class="field w-auto max-w-[220px]" aria-label="Filtrar por proyecto"></select>
          <select id="f-member" data-filter="member" class="field w-auto max-w-[220px]" aria-label="Filtrar por responsable"></select>
          <button type="button" id="f-clear" class="btn-ghost hidden" data-action="clear-filters"><i data-lucide="x" class="w-4 h-4"></i>Limpiar filtros</button>
        </div>
      </header>

      <main id="main" class="flex-1 overflow-auto"></main>
    </div>
  </div>
</div>

<div id="gate" class="fixed inset-0 z-[80] bg-slate-50 items-center justify-center p-6 overflow-y-auto" style="display:flex"></div>
<div id="modal-root"></div>
<div id="toast-root" class="fixed bottom-5 right-5 z-[70] flex flex-col gap-2 items-end"></div>

const BRAND_LOGO = LOGOS['lagencia'];
const VIEW_TITLES = { home: 'Espacio de trabajo', projects: 'Proyectos', board: 'Tablero', list: 'Lista de tareas', calendar: 'Calendario', log: 'Bitácora de avances', team: 'Equipo y proyectos' };

/* ================================ Utils ================================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const icons = () => { try { if (window.lucide) window.lucide.createIcons(); } catch (e) { /* noop */ } };
const pad = n => String(n).padStart(2, '0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayISO = () => isoOf(new Date());
const addDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return isoOf(d); };
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const fmtShort = s => s ? parseISO(s).toLocaleDateString('es-CO', { day: 'numeric', month: 'short' }).replace('.', '') : '';
const fmtFull = s => { if (!s) return ''; const d = parseISO(s); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`; };
const fmtStamp = ts => new Date(ts).toLocaleString('es-CO', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const initials = n => String(n).trim().split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase();
const status = id => STATUSES.find(s => s.id === id) || STATUSES[0];
const prio = id => PRIORITIES.find(p => p.id === id) || PRIORITIES[1];
const logType = id => LOG_TYPES.find(t => t.id === id) || LOG_TYPES[0];
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

const Store = {
  state: null,
  mode: 'local',
  empty() { return { companies: [], projects: [], members: [], tasks: [], logs: [], seq: 0 }; },
  seedDocs() { const d = seed(); return COLLS.flatMap(c => d[c].map(item => ({ coll: c, id: item.id, data: clean(item) }))); },
  loadLocal() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const s = JSON.parse(raw);
        if (s && Array.isArray(s.tasks) && Array.isArray(s.projects) && Array.isArray(s.members) && Array.isArray(s.companies)) {
          s.logs = Array.isArray(s.logs) ? s.logs : [];
          s.seq = Number(s.seq) || s.tasks.length;
          this.state = s;
          return;
        }
      }
    } catch (e) { /* datos corruptos: se reinicia con demo */ }
    this.state = seed();
    this.save();
  },
  saveLocal() { try { localStorage.setItem(KEY, JSON.stringify(this.state)); } catch (e) { Toast.show('No se pudo guardar en el navegador', 'error'); } },
  save() { if (this.mode === 'cloud') Sync.push(); else this.saveLocal(); },
  company(id) { return this.state.companies.find(x => x.id === id); },
  project(id) { return this.state.projects.find(x => x.id === id); },
  member(id) { return this.state.members.find(x => x.id === id); },
  task(id) { return this.state.tasks.find(x => x.id === id); },
  addTask(data) {
    const n = this.state.tasks.reduce((m, x) => Math.max(m, parseInt(String(x.id).replace(/\D/g, ''), 10) || 0), 0) + 1;
    this.state.seq = n;
    const t = { ...data, id: 'T-' + String(n).padStart(3, '0'), createdAt: Date.now(), updatedAt: Date.now() };
    this.state.tasks.push(t); this.save(); return t;
  },
  updateTask(id, patch) { const t = this.task(id); if (t) { Object.assign(t, patch, { updatedAt: Date.now() }); this.save(); } return t; },
  deleteTask(id) { this.state.tasks = this.state.tasks.filter(t => t.id !== id); this.state.logs = this.state.logs.filter(l => l.taskId !== id); this.save(); },
  addMember(name, photo = '') {
    const m = { id: uid('m'), name: name.trim(), color: PALETTE[this.state.members.length * 5 % PALETTE.length], photo: photo.trim(), ord: Date.now() };
    this.state.members.push(m); this.save(); return m;
  },
  deleteMember(id) {
    this.state.members = this.state.members.filter(m => m.id !== id);
    this.state.tasks.forEach(t => { if (t.assigneeId === id) t.assigneeId = ''; });
    this.state.logs.forEach(l => { if (l.authorId === id) l.authorId = ''; });
    this.save();
  },
  addProject(name, description = '', color) {
    const p = { id: uid('p'), name: name.trim(), description: description.trim(), color: color || PALETTE[this.state.projects.length % PALETTE.length], ord: Date.now() };
    this.state.projects.push(p); this.save(); return p;
  },
  updateProject(id, patch) { const p = this.project(id); if (p) { Object.assign(p, patch); this.save(); } },
  deleteProject(id) {
    this.state.projects = this.state.projects.filter(p => p.id !== id);
    this.state.tasks = this.state.tasks.filter(t => t.projectId !== id);
    this.state.logs = this.state.logs.filter(l => l.projectId !== id);
    this.save();
  },
  addCompany(name, description = '') { const c = { id: uid('c'), name: name.trim(), description: description.trim(), ord: Date.now() }; this.state.companies.push(c); this.save(); return c; },
  updateCompany(id, patch) { const c = this.company(id); if (c) { Object.assign(c, patch); this.save(); } },
  deleteCompany(id) { this.state.companies = this.state.companies.filter(c => c.id !== id); this.save(); },
  addLog(data) { const l = { ts: Date.now(), ...data, id: uid('l') }; this.state.logs.unshift(l); this.save(); return l; },
  deleteLog(id) { this.state.logs = this.state.logs.filter(l => l.id !== id); this.save(); }
};

function filteredTasks() {
  const q = norm(Filters.q.trim());
  return Store.state.tasks.filter(t => {
    if (Filters.company && t.companyId !== Filters.company) return false;
    if (Filters.project && t.projectId !== Filters.project) return false;
    if (Filters.member && t.assigneeId !== Filters.member) return false;
    if (q) {
      const hay = norm([t.id, t.title, Store.project(t.projectId)?.name, Store.company(t.companyId)?.name, Store.member(t.assigneeId)?.name, (t.tags || []).join(' ')].join(' '));
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}
const isOverdue = t => t.due && t.status !== 'done' && t.due < todayISO();
const hasFilters = () => !!(Filters.q || Filters.project || Filters.member);

const Toast = {

    setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 2800);

const Modal = {
  stack: [],
  open({ title, body, footer = '', size = 'max-w-xl', onMount }) {
    const wrap = document.createElement('div');
    wrap.className = 'fixed inset-0 z-50 flex items-start sm:items-center justify-center p-4 overflow-y-auto';
    wrap.innerHTML = `
      <div class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm modal-fade" data-modal-close></div>
      <div class="relative w-full ${size} bg-white rounded-2xl shadow-2xl modal-pop my-auto" role="dialog" aria-modal="true" aria-label="${esc(title)}">
        <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100">
          <h3 class="text-base font-semibold text-slate-900">${esc(title)}</h3>
          <button type="button" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100" data-modal-close aria-label="Cerrar"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <div class="px-6 py-5">${body}</div>
        ${footer ? `<div class="px-6 py-4 border-t border-slate-100 bg-slate-50/70 rounded-b-2xl flex items-center justify-end gap-2">${footer}</div>` : ''}
      </div>`;
    $('#modal-root').appendChild(wrap);
    this.stack.push(wrap);
    icons();
    if (onMount) onMount(wrap);
    const first = wrap.querySelector('input:not([type=hidden]):not([type=color]), textarea, select');
    if (first) setTimeout(() => first.focus(), 30);
    return wrap;
  },
  closeEl(wrap) { this.stack = this.stack.filter(w => w !== wrap); wrap.remove(); },
  closeTop() { const w = this.stack[this.stack.length - 1]; if (w) this.closeEl(w); }
};

function confirmDialog({ title, text, confirmLabel = 'Eliminar' }) {
  return new Promise(resolve => {
    const w = Modal.open({
      title, size: 'max-w-md',
      body: `<div class="flex gap-3"><div class="w-10 h-10 rounded-full bg-red-50 text-red-600 flex items-center justify-center shrink-0"><i data-lucide="triangle-alert" class="w-5 h-5"></i></div><p class="text-sm text-slate-600 leading-relaxed pt-1.5">${esc(text)}</p></div>`,
      footer: `<button type="button" class="btn-ghost" data-c="no">Cancelar</button><button type="button" class="btn-danger" data-c="yes">${esc(confirmLabel)}</button>`
    });
    w.addEventListener('click', e => {
      const b = e.target.closest('[data-c]');
      if (b) { Modal.closeEl(w); resolve(b.dataset.c === 'yes'); }
      else if (e.target.closest('[data-modal-close]')) resolve(false);
    });
  });
}

const Popover = {
  el: null,
  open(anchor, items, width = 210) {
    this.close();
    const el = document.createElement('div');
    el.className = 'fixed z-[60] bg-white rounded-xl shadow-xl border border-slate-200 py-1.5 popover-pop max-h-72 overflow-y-auto';
    el.style.width = width + 'px';
    el.innerHTML = items.map((it, i) => `
      <button type="button" data-pop="${i}" class="w-full flex items-center gap-2.5 px-3 py-2 text-sm text-left text-slate-700 hover:bg-slate-50 ${it.active ? 'bg-slate-50 font-semibold' : ''}">
        ${it.html}${it.active ? '<i data-lucide="check" class="w-4 h-4 ml-auto text-indigo-600 shrink-0"></i>' : ''}
      </button>`).join('');
    document.body.appendChild(el);
    const r = anchor.getBoundingClientRect();
    let left = Math.max(8, Math.min(r.left, window.innerWidth - width - 8));
    let top = r.bottom + 6;
    if (top + el.offsetHeight > window.innerHeight - 8) top = Math.max(8, r.top - el.offsetHeight - 6);
    el.style.left = left + 'px'; el.style.top = top + 'px';
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-pop]'); if (!b) return;
      const it = items[Number(b.dataset.pop)];
      this.close(); if (it && it.onClick) it.onClick();
    });
    this.el = el; icons();
  },
  close() { if (this.el) { this.el.remove(); this.el = null; } }
};

/* ================================ Vistas ================================= */
function kpis(tasks) {
  const total = tasks.length;
  const prog = tasks.filter(t => t.status === 'progress').length;
  const over = tasks.filter(isOverdue).length;
  const done = tasks.filter(t => t.status === 'done').length;
  const pct = total ? Math.round(done / total * 100) : 0;
  const card = (label, val, icon, tone) => `<div class="bg-white rounded-xl border border-slate-200 shadow-sm px-4 py-3 flex items-center gap-3">
      <div class="w-10 h-10 rounded-lg flex items-center justify-center ${tone}"><i data-lucide="${icon}" class="w-5 h-5"></i></div>
      <div><p class="text-xl font-bold text-slate-900 leading-none">${val}</p><p class="text-xs text-slate-500 mt-1">${label}</p></div></div>`;
  return `<div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5">
    ${card('Tareas', total, 'clipboard-list', 'bg-indigo-50 text-indigo-600')}
    ${card('En progreso', prog, 'loader', 'bg-blue-50 text-blue-600')}
    ${card('Vencidas', over, 'alarm-clock', 'bg-red-50 text-red-600')}
    ${card('Completadas · ' + pct + '%', done, 'circle-check', 'bg-emerald-50 text-emerald-600')}
  </div>`;
}

function noResults() {
  return emptyState({
    icon: 'search-x', title: 'No hay tareas para mostrar',
    text: hasFilters() ? 'Ninguna tarea coincide con los filtros actuales. Prueba limpiándolos.' : 'Crea tu primera tarea para empezar a dar trazabilidad a tus proyectos.',

}

  if (!tasks.length) return kpis(tasks) + noResults();
  return kpis(tasks) + boardHTML(tasks);

/* ---- Lista ---- */
function sortTasks(tasks) {
  const { key, dir } = UI.sort;
  if (!key) return tasks.slice().sort((a, b) => b.createdAt - a.createdAt || b.id.localeCompare(a.id));
  const val = t => ({
    title: norm(t.title), project: norm(Store.project(t.projectId)?.name), company: norm(Store.company(t.companyId)?.name),
    assignee: norm(Store.member(t.assigneeId)?.name), due: t.due || '9999-99-99', priority: prio(t.priority).w,
    status: STATUSES.findIndex(s => s.id === t.status)
  }[key]);
  return tasks.slice().sort((a, b) => { const x = val(a), y = val(b); return (x > y ? 1 : x < y ? -1 : 0) * dir; });
}

function listTable(tasks, { hideProject = false } = {}) {

      ${hideProject ? '' : `<td class="px-4 py-3 max-w-[200px]">${projectChip(p)}</td>`}

      <td class="px-4 py-3"><input type="date" value="${esc(t.due || '')}" data-change="due" data-id="${t.id}" class="text-sm rounded-md border border-transparent hover:border-slate-200 bg-transparent px-1.5 py-1 ${isOverdue(t) ? 'text-red-600 font-semibold' : 'text-slate-600'} focus:outline-none focus:border-indigo-400" aria-label="Fecha límite"></td>
      <td class="px-4 py-3"><button type="button" data-action="prio-menu" data-id="${t.id}" class="hover:opacity-80">${prioBadge(t.priority)}</button></td>

        <button type="button" data-action="delete-task" data-id="${t.id}" class="p-1.5 rounded-md text-slate-400 hover:text-red-600 hover:bg-red-50" title="Eliminar"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
      </td></tr>`;

}

function renderList() {
  const tasks = filteredTasks();
  return kpis(tasks) + (tasks.length ? listTable(tasks) : noResults());
}

/* ---- Calendario ---- */
function renderCalendar() {
  const { y, m } = UI.cal;
  const tasks = filteredTasks();
  const byDate = {};
  tasks.forEach(t => { if (t.due) (byDate[t.due] = byDate[t.due] || []).push(t); });
  const noDate = tasks.filter(t => !t.due).length;
  const first = new Date(y, m, 1);
  const offset = (first.getDay() + 6) % 7;
  const dim = new Date(y, m + 1, 0).getDate();
  const cells = Math.ceil((offset + dim) / 7) * 7;
  const today = todayISO();
  const monthLabel = first.toLocaleDateString('es-CO', { month: 'long', year: 'numeric' });
  let grid = '';
  for (let i = 0; i < cells; i++) {
    const d = new Date(y, m, 1 - offset + i);
    const iso = isoOf(d);
    const inMonth = d.getMonth() === m;
    const items = byDate[iso] || [];
    const chips = items.slice(0, 3).map(t => `<button type="button" data-action="edit-task" data-id="${t.id}" title="${esc(t.title)} · ${esc(Store.project(t.projectId)?.name || '')}" class="w-full text-left truncate text-[11px] font-medium px-1.5 py-1 rounded-md flex items-center gap-1.5 ${status(t.status).soft} hover:brightness-95"><span class="w-1.5 h-1.5 rounded-full shrink-0" style="background:${esc(Store.project(t.projectId)?.color || '#94a3b8')}"></span><span class="truncate">${esc(t.title)}</span></button>`).join('');
    const more = items.length > 3 ? `<p class="text-[11px] text-slate-500 font-medium px-1">+${items.length - 3} más</p>` : '';
    grid += `<div data-action="new-task-date" data-date="${iso}" class="group relative min-h-[112px] p-1.5 border-b border-r border-slate-100 cursor-pointer hover:bg-indigo-50/40 transition ${inMonth ? 'bg-white' : 'bg-slate-50/70'}">
      <div class="flex items-center justify-between mb-1">
        <span class="text-xs font-semibold w-6 h-6 inline-flex items-center justify-center rounded-full ${iso === today ? 'bg-indigo-600 text-white' : inMonth ? 'text-slate-700' : 'text-slate-400'}">${d.getDate()}</span>
        <i data-lucide="plus" class="w-3.5 h-3.5 text-slate-300 opacity-0 group-hover:opacity-100"></i>
      </div>
      <div class="space-y-1">${chips}${more}</div></div>`;
  }
  return `<div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
    <div class="flex items-center justify-between px-4 py-3 border-b border-slate-200">
      <h2 class="text-base font-semibold text-slate-900 capitalize">${esc(monthLabel)}</h2>
      <div class="flex items-center gap-1.5">
        <button class="btn-secondary !px-2.5" data-action="cal-prev" aria-label="Mes anterior"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
        <button class="btn-secondary" data-action="cal-today">Hoy</button>
        <button class="btn-secondary !px-2.5" data-action="cal-next" aria-label="Mes siguiente"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
      </div>
    </div>
    <div class="overflow-x-auto"><div class="min-w-[760px]">
      <div class="grid grid-cols-7 bg-slate-50 border-b border-slate-200">${WEEKDAYS.map(w => `<div class="px-3 py-2 text-[11px] font-semibold uppercase tracking-wider text-slate-500">${w}</div>`).join('')}</div>
      <div class="grid grid-cols-7 border-l border-slate-100">${grid}</div>
    </div></div>
  </div>
  ${noDate ? `<p class="mt-3 text-xs text-slate-500 flex items-center gap-1.5"><i data-lucide="info" class="w-3.5 h-3.5"></i>${noDate} tarea(s) sin fecha límite no aparecen en el calendario.</p>` : ''}`;
}

/* ---- Detalle de proyecto ---- */
function renderProject() {
  const p = Store.project(UI.projectId);
  if (!p) { UI.view = 'board'; return renderBoard(); }
  const tasks = Store.state.tasks.filter(t => t.projectId === p.id);
  const logs = Store.state.logs.filter(l => l.projectId === p.id);
  const done = tasks.filter(t => t.status === 'done').length;
  const pct = tasks.length ? Math.round(done / tasks.length * 100) : 0;
  const over = tasks.filter(isOverdue).length;
  const companies = [...new Set(tasks.map(t => t.companyId))].map(id => Store.company(id)?.name).filter(Boolean);
  const tab = UI.projectTab;
  const tabBtn = (id, label, icon, count) => `<button type="button" data-action="project-tab" data-tab="${id}" class="px-4 py-2.5 text-sm font-medium border-b-2 -mb-px flex items-center gap-2 ${tab === id ? 'border-indigo-600 text-indigo-700' : 'border-transparent text-slate-500 hover:text-slate-800'}"><i data-lucide="${icon}" class="w-4 h-4"></i>${label}<span class="text-xs rounded-full px-2 py-0.5 ${tab === id ? 'bg-indigo-100 text-indigo-700' : 'bg-slate-100 text-slate-500'}">${count}</span></button>`;
  const body = tab === 'tasks'
    ? (tasks.length ? (Prefs.data.projectLayout === 'list' ? listTable(tasks, { hideProject: true }) : boardHTML(tasks)) : emptyState({ icon: 'clipboard-list', title: 'Este proyecto aún no tiene tareas', text: 'Crea la primera tarea para comenzar el seguimiento.', action: `<button class="btn-primary mt-5" data-action="new-task" data-project="${p.id}"><i data-lucide="plus" class="w-4 h-4"></i>Nueva tarea</button>` }))
    : `<div class="max-w-3xl">${logs.length ? `<ul class="space-y-4">${logs.map(l => logEntryHTML(l, false)).join('')}</ul>` : emptyState({ icon: 'notebook-pen', title: 'Sin entradas en la bitácora', text: 'Registra el primer avance, novedad o bloqueo de este proyecto.', action: `<button class="btn-primary mt-5" data-action="new-log" data-project="${p.id}"><i data-lucide="message-square-plus" class="w-4 h-4"></i>Registrar avance</button>` })}</div>`;
  return `<div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5 mb-5">
    <div class="flex flex-wrap items-start justify-between gap-4">
      <div class="flex items-start gap-3 min-w-0">
        <span class="w-3 h-12 rounded-full shrink-0" style="background:${esc(p.color)}"></span>
        <div class="min-w-0"><h2 class="text-lg font-bold text-slate-900">${esc(p.name)}</h2>
          <p class="text-sm text-slate-500 mt-0.5">${esc(p.description || 'Sin descripción')}</p>
          ${companies.length ? `<p class="text-xs text-slate-500 mt-2 flex items-center gap-1.5 flex-wrap"><i data-lucide="building-2" class="w-3.5 h-3.5"></i>${companies.map(esc).join(' · ')}</p>` : ''}</div>
      </div>
      <div class="flex items-center gap-2 flex-wrap">
        <button class="btn-secondary" data-action="new-log" data-project="${p.id}"><i data-lucide="message-square-plus" class="w-4 h-4"></i>Registrar avance</button>
        <button class="btn-secondary" data-action="edit-project" data-id="${p.id}"><i data-lucide="pencil" class="w-4 h-4"></i>Editar</button>
        <button class="btn-danger-ghost" data-action="delete-project" data-id="${p.id}"><i data-lucide="trash-2" class="w-4 h-4"></i>Eliminar</button>
      </div>
    </div>
    <div class="mt-5 grid grid-cols-1 sm:grid-cols-3 gap-4 items-center">
      <div class="sm:col-span-2"><div class="flex justify-between text-xs font-medium text-slate-500 mb-1.5"><span>Progreso</span><span>${done}/${tasks.length} tareas · ${pct}%</span></div>
        <div class="h-2.5 rounded-full bg-slate-100 overflow-hidden"><div class="h-full rounded-full bg-emerald-500 transition-all" style="width:${pct}%"></div></div></div>
      <div class="flex items-center gap-2 text-sm ${over ? 'text-red-600' : 'text-slate-500'} font-medium"><i data-lucide="${over ? 'alarm-clock' : 'circle-check'}" class="w-4 h-4"></i>${over ? over + ' tarea(s) vencida(s)' : 'Sin tareas vencidas'}</div>
    </div></div>
  <div class="flex items-center justify-between border-b border-slate-200 mb-4">
    <div class="flex">${tabBtn('tasks', 'Tareas', 'list-checks', tasks.length)}${tabBtn('log', 'Bitácora', 'notebook-pen', logs.length)}</div>
    ${tab === 'tasks' ? `<div class="flex items-center gap-2 mb-2 flex-wrap justify-end">${layoutToggle(Prefs.data.projectLayout === 'list' ? 'list' : 'kanban', 'project-layout')}<button type="button" class="btn-primary" data-action="new-task" data-project="${p.id}"><i data-lucide="plus" class="w-4 h-4"></i>Nueva tarea</button></div>` : ''}

/* ---- Selectores de vista ---- */
function layoutToggle(current, action) {

  return `<div class="inline-flex items-center gap-0.5 p-1 rounded-lg bg-slate-100" role="group" aria-label="Elegir vista">${b('kanban', 'Kanban', 'kanban')}${b('list', 'Lista', 'list')}</div>`;
}

function viewSwitchHTML() {
  const b = (v, label, icon) => `<button type="button" data-action="nav" data-view="${v}" class="flex items-center gap-1.5 px-3 py-1.5 text-sm font-medium rounded-md transition ${UI.view === v ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-600 hover:text-slate-900'}" aria-pressed="${UI.view === v}" title="${label}"><i data-lucide="${icon}" class="w-4 h-4"></i><span class="hidden sm:inline">${label}</span></button>`;
  return `<div class="inline-flex items-center gap-0.5 p-1 rounded-lg bg-slate-100" role="group" aria-label="Elegir vista">${b('board', 'Kanban', 'kanban')}${b('list', 'Lista', 'list')}${b('calendar', 'Calendario', 'calendar-days')}</div>`;
}

/* ---- Vista Proyectos (Kanban o Lista) ---- */
const PHASES = [
  { id: 'idle',   label: 'Sin iniciar', dot: 'bg-slate-400',   soft: 'bg-slate-100 text-slate-700' },
  { id: 'active', label: 'En curso',    dot: 'bg-blue-500',    soft: 'bg-blue-100 text-blue-700' },
  { id: 'done',   label: 'Completado',  dot: 'bg-emerald-500', soft: 'bg-emerald-100 text-emerald-700' }
];

function projectStats(p, tasks) {
  const pt = tasks.filter(t => t.projectId === p.id);
  const c = { todo: 0, progress: 0, review: 0, done: 0 };
  pt.forEach(t => { c[t.status] = (c[t.status] || 0) + 1; });
  const total = pt.length;
  const phase = !total || c.todo === total ? 'idle' : c.done === total ? 'done' : 'active';
  return {
    p, c, total, phase,
    pct: total ? Math.round(c.done / total * 100) : 0,
    over: pt.filter(isOverdue).length,
    companies: [...new Set(pt.map(t => t.companyId))].map(id => Store.company(id)).filter(Boolean),
    members: [...new Set(pt.map(t => t.assigneeId).filter(Boolean))].map(id => Store.member(id)).filter(Boolean)
  };
}

function companyMini(co) {
  const logo = companyLogo(co);
  return logo
    ? `<img src="${esc(logo)}" alt="${esc(co.name)}" title="${esc(co.name)}" class="h-5 max-w-[72px] object-contain">`
    : `<span class="text-[11px] text-slate-500 truncate max-w-[100px]" title="${esc(co.name)}">${esc(co.name)}</span>`;
}

function projectCardHTML(st) {
  const { p, c, total, pct, over, companies, members } = st;
  return `<button type="button" data-action="open-project" data-id="${p.id}" class="w-full text-left bg-white rounded-xl border border-slate-200 shadow-sm hover:shadow-md hover:border-indigo-200 p-4 transition">
    <div class="flex items-center gap-2.5 min-w-0"><span class="w-3 h-3 rounded-full shrink-0" style="background:${esc(p.color)}"></span><h4 class="text-sm font-semibold text-slate-800 truncate">${esc(p.name)}</h4></div>
    ${p.description ? `<p class="mt-1.5 text-xs text-slate-500 line-clamp-2">${esc(p.description)}</p>` : ''}
    <div class="mt-3 h-1.5 rounded-full bg-slate-100 overflow-hidden"><div class="h-full bg-emerald-500" style="width:${pct}%"></div></div>
    <div class="mt-2 flex items-center justify-between text-xs text-slate-500"><span>${total} tarea${total === 1 ? '' : 's'} · ${pct}%</span>${over ? `<span class="text-red-600 font-medium">${over} vencida${over === 1 ? '' : 's'}</span>` : ''}</div>
    ${total ? `<div class="mt-3 flex flex-wrap gap-1.5">${STATUSES.map(s => c[s.id] ? `<span class="inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-[11px] font-semibold ${s.soft}">${c[s.id]} ${s.label}</span>` : '').join('')}</div>` : ''}
    <div class="mt-3 pt-3 border-t border-slate-100 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5 min-w-0 flex-wrap">${companies.slice(0, 3).map(companyMini).join('') || '<span class="text-[11px] text-slate-400">Sin empresa</span>'}</div>
      <div class="flex -space-x-2 shrink-0">${members.slice(0, 4).map(m => avatar(m, 'w-6 h-6', 'text-[9px]')).join('')}</div>
    </div></button>`;
}

function projectsKanban(projs) {
  return `<div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-start">${PHASES.map(ph => {
    const items = projs.filter(x => x.phase === ph.id);
    return `<section class="flex flex-col bg-slate-100/70 rounded-2xl p-3 min-h-[200px]">
      <header class="flex items-center gap-2 px-1 pb-3"><span class="w-2.5 h-2.5 rounded-full ${ph.dot}"></span><h3 class="text-sm font-semibold text-slate-700">${ph.label}</h3><span class="text-xs font-semibold text-slate-500 bg-white rounded-full px-2 py-0.5 border border-slate-200">${items.length}</span></header>
      <div class="space-y-3">${items.map(projectCardHTML).join('') || '<div class="h-24 rounded-xl border border-dashed border-slate-300 flex items-center justify-center text-xs text-slate-400">Sin proyectos</div>'}</div></section>`;
  }).join('')}</div>`;
}

function projectsTable(projs) {
  const num = (n, cls) => `<td class="px-4 py-3 text-sm text-center ${n ? cls : 'text-slate-300'}">${n}</td>`;
  const rows = projs.map(st => {
    const { p, c, total, pct, over, phase, companies } = st;
    const ph = PHASES.find(x => x.id === phase);
    return `<tr data-action="open-project" data-id="${p.id}" class="border-b border-slate-100 last:border-0 hover:bg-slate-50/70 cursor-pointer">
      <td class="px-4 py-3 min-w-[230px]"><div class="flex items-center gap-2.5"><span class="w-3 h-3 rounded-full shrink-0" style="background:${esc(p.color)}"></span><div class="min-w-0"><p class="text-sm font-medium text-slate-800">${esc(p.name)}</p>${p.description ? `<p class="text-xs text-slate-500 truncate max-w-[300px]">${esc(p.description)}</p>` : ''}</div></div></td>
      <td class="px-4 py-3"><span class="inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-xs font-semibold ${ph.soft}"><span class="w-1.5 h-1.5 rounded-full ${ph.dot}"></span>${ph.label}</span></td>

function relTime(ts) {
  const s = Math.max(0, Math.round((Date.now() - ts) / 1000));
  if (s < 60) return 'hace un momento';
  const m = Math.round(s / 60); if (m < 60) return `hace ${m} min`;
  const h = Math.round(m / 60); if (h < 24) return `hace ${h} h`;
  const d = Math.round(h / 24); if (d < 30) return `hace ${d} ${d === 1 ? 'día' : 'días'}`;
  return fmtStamp(ts);
}

function readLogoFile(file) {
  return new Promise((resolve, reject) => {
    if (!file || !/^image\//.test(file.type)) { reject(new Error('Selecciona un archivo de imagen.')); return; }
    const fr = new FileReader();
    fr.onerror = () => reject(new Error('No se pudo leer el archivo.'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('No se pudo procesar la imagen.'));
      img.onload = () => {
        const r = Math.min(1, 480 / Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.max(1, Math.round(img.width * r)); cv.height = Math.max(1, Math.round(img.height * r));
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        let url = cv.toDataURL('image/png');
        if (url.length > 600000) {
          const ctx = cv.getContext('2d');
          ctx.globalCompositeOperation = 'destination-over'; ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, cv.width, cv.height);
          url = cv.toDataURL('image/jpeg', 0.85);
        }
        resolve(url);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

    title: '', projectId: preset.projectId || Filters.project || (S.projects[0] && S.projects[0].id) || '',
    companyId: preset.companyId || Filters.company || (S.companies[0] && S.companies[0].id) || '',
    assigneeId: preset.assigneeId || Filters.member || '', due: preset.due || '', priority: 'medium', status: preset.status || 'todo', tags: []
  };
  const pending = [];
  let pendingSeq = 0;
  const startTab = preset.tab === 'log' && editing ? 'log' : 'details';
  const typeOpts = LOG_TYPES.map(t => `<option value="${t.id}">${t.label}</option>`).join('');

  const body = `
    <div class="flex border-b border-slate-200 -mt-2 mb-5" role="tablist">
      <button type="button" data-ttab="details" class="px-4 py-2.5 text-sm font-medium border-b-2 -mb-px flex items-center gap-2"><i data-lucide="clipboard-list" class="w-4 h-4"></i>Detalles</button>
      <button type="button" data-ttab="log" class="px-4 py-2.5 text-sm font-medium border-b-2 -mb-px flex items-center gap-2"><i data-lucide="notebook-pen" class="w-4 h-4"></i>Seguimiento<span id="tl-count" class="text-xs rounded-full px-2 py-0.5 bg-slate-100 text-slate-600">0</span></button>
    </div>

    <div data-tpanel="details">
      <form id="task-form" class="space-y-4" novalidate>
        <div><label class="lbl" for="tf-title">Título de la tarea *</label><input id="tf-title" name="title" class="field" maxlength="160" placeholder="Ej. Definir alcance del módulo de reportes" value="${esc(d.title)}" required><p id="tf-err" class="hidden text-xs text-red-600 mt-1.5"></p></div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div><label class="lbl" for="tf-project">Proyecto</label><select id="tf-project" class="field">${selectOptions(S.projects, d.projectId, { addNew: 'Nuevo proyecto…' })}</select></div>
          <div><label class="lbl" for="tf-company">Empresa</label><div class="flex items-center gap-2"><span id="tf-logo" class="shrink-0"></span><select id="tf-company" class="field">${selectOptions(S.companies, d.companyId)}</select></div></div>
        </div>
        <div id="np-row" class="hidden"><div class="flex gap-2 p-3 rounded-lg bg-indigo-50/60 border border-indigo-100"><input id="np-name" class="field" placeholder="Nombre del nuevo proyecto" maxlength="80"><button type="button" id="np-add" class="btn-primary shrink-0">Añadir</button></div></div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div><label class="lbl" for="tf-assignee">Responsable</label><div class="flex items-center gap-2"><span id="tf-avatar" class="shrink-0"></span><select id="tf-assignee" class="field">${selectOptions(S.members, d.assigneeId, { empty: 'Sin asignar', addNew: 'Nuevo responsable…' })}</select></div></div>
          <div><label class="lbl" for="tf-due">Fecha límite</label><input id="tf-due" type="date" class="field" value="${esc(d.due || '')}"></div>
        </div>
        <div id="nm-row" class="hidden"><div class="flex gap-2 p-3 rounded-lg bg-indigo-50/60 border border-indigo-100"><input id="nm-name" class="field" placeholder="Nombre completo del nuevo responsable" maxlength="80"><button type="button" id="nm-add" class="btn-primary shrink-0">Añadir</button></div></div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div><label class="lbl" for="tf-priority">Prioridad</label><select id="tf-priority" class="field">${PRIORITIES.map(p => `<option value="${p.id}" ${p.id === d.priority ? 'selected' : ''}>${p.label}</option>`).join('')}</select></div>
          <div><label class="lbl" for="tf-status">Estado</label><select id="tf-status" class="field">${STATUSES.map(s => `<option value="${s.id}" ${s.id === d.status ? 'selected' : ''}>${s.label}</option>`).join('')}</select></div>
        </div>
        <div><label class="lbl" for="tf-tags">Etiquetas <span class="font-normal text-slate-400">(separadas por coma)</span></label><input id="tf-tags" class="field" placeholder="Ej. Backend, Integración" value="${esc((d.tags || []).join(', '))}"></div>
      </form>
    </div>

    <div data-tpanel="log" class="hidden">
      <div class="space-y-4">
        <div class="rounded-xl border border-slate-200 bg-slate-50/70 p-4 space-y-3">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div><label class="lbl" for="tl-type">Tipo de registro</label><select id="tl-type" class="field">${typeOpts}</select></div>
            <div><label class="lbl" for="tl-author">Autor</label><select id="tl-author" class="field">${selectOptions(S.members, UI.lastAuthor || d.assigneeId, { empty: 'Selecciona un autor…' })}</select></div>
          </div>
          <div><label class="lbl" for="tl-text">Avance, novedad o bloqueo</label><textarea id="tl-text" rows="3" class="field resize-none" maxlength="1500" placeholder="Describe qué se logró, qué cambió o qué está bloqueando esta tarea…"></textarea></div>
          <p id="tl-err" class="hidden text-xs text-red-600"></p>
          <div class="flex items-center justify-between gap-3">
            <p class="text-xs text-slate-400 flex items-center gap-1.5"><i data-lucide="clock" class="w-3.5 h-3.5 shrink-0"></i>${editing ? 'Se guarda al instante con fecha y hora automáticas.' : 'Se guardará junto con la tarea.'}</p>
            <button type="button" id="tl-add" class="btn-primary shrink-0"><i data-lucide="send" class="w-4 h-4"></i>Registrar</button>
          </div>
        </div>
        <ul id="tl-list" class="space-y-3"></ul>
      </div>
    </div>`;
  const footer = `${editing ? '<button type="button" class="btn-danger-ghost mr-auto" id="tf-delete"><i data-lucide="trash-2" class="w-4 h-4"></i>Eliminar</button>' : ''}
    <button type="button" class="btn-ghost" data-modal-close>Cancelar</button>
    <button type="submit" form="task-form" class="btn-primary"><i data-lucide="check" class="w-4 h-4"></i>${editing ? 'Guardar cambios' : 'Crear tarea'}</button>`;

  Modal.open({
    title: editing ? `Tarea ${editing.id}` : 'Nueva tarea', body, footer, size: 'max-w-2xl',
    onMount: w => {
      const q = s => w.querySelector(s);
      const showTab = tab => {
        w.querySelectorAll('[data-tpanel]').forEach(p => p.classList.toggle('hidden', p.dataset.tpanel !== tab));
        w.querySelectorAll('[data-ttab]').forEach(b => {
          const on = b.dataset.ttab === tab;
          b.classList.toggle('border-indigo-600', on); b.classList.toggle('text-indigo-700', on);
          b.classList.toggle('border-transparent', !on); b.classList.toggle('text-slate-500', !on);
        });
      };
      w.querySelectorAll('[data-ttab]').forEach(b => b.addEventListener('click', () => showTab(b.dataset.ttab)));

      /* ---- Detalles ---- */
      const selP = q('#tf-project'), selM = q('#tf-assignee'), selC = q('#tf-company');
      const paintAvatar = () => { q('#tf-avatar').innerHTML = avatar(Store.member(selM.value), 'w-9 h-9', 'text-xs'); icons(); };
      const paintLogo = () => { const c = Store.company(selC.value); q('#tf-logo').innerHTML = companyLogo(c) ? wsTile(c, 'w-14 h-9', 'text-xs', 'rounded-lg') : ''; };
      paintAvatar(); paintLogo();
      selC.addEventListener('change', paintLogo);
      const toggleRow = (row, show, input) => { row.classList.toggle('hidden', !show); if (show) setTimeout(() => input.focus(), 20); };
      selP.addEventListener('change', () => toggleRow(q('#np-row'), selP.value === '__new__', q('#np-name')));
      selM.addEventListener('change', () => { toggleRow(q('#nm-row'), selM.value === '__new__', q('#nm-name')); if (selM.value !== '__new__') paintAvatar(); });
      const addProject = () => {
        const name = q('#np-name').value.trim(); if (!name) return;
        if (Store.state.projects.some(p => norm(p.name) === norm(name))) { Toast.show('Ya existe un proyecto con ese nombre', 'error'); return; }
        const p = Store.addProject(name);
        selP.innerHTML = selectOptions(Store.state.projects, p.id, { addNew: 'Nuevo proyecto…' });
        q('#np-name').value = ''; toggleRow(q('#np-row'), false); Toast.show('Proyecto creado'); App.render();
      };
      const addMember = () => {
        const name = q('#nm-name').value.trim(); if (!name) return;
        if (Store.state.members.some(m => norm(m.name) === norm(name))) { Toast.show('Ya existe un responsable con ese nombre', 'error'); return; }
        const m = Store.addMember(name);
        selM.innerHTML = selectOptions(Store.state.members, m.id, { empty: 'Sin asignar', addNew: 'Nuevo responsable…' });
        q('#tl-author').innerHTML = selectOptions(Store.state.members, q('#tl-author').value, { empty: 'Selecciona un autor…' });
        q('#nm-name').value = ''; toggleRow(q('#nm-row'), false); paintAvatar(); Toast.show('Responsable añadido'); App.render();
      };
      q('#np-add').addEventListener('click', addProject);
      q('#nm-add').addEventListener('click', addMember);
      q('#np-name').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addProject(); } });
      q('#nm-name').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addMember(); } });

      /* ---- Seguimiento (bitácora de la tarea) ---- */
      const logsNow = () => (editing ? Store.state.logs.filter(l => l.taskId === editing.id) : []).concat(pending).sort((a, b) => b.ts - a.ts);
      const paintLogs = () => {
        const list = logsNow();
        q('#tl-count').textContent = String(list.length);
        q('#tl-list').innerHTML = list.length ? list.map(l => {
          const m = Store.member(l.authorId), t = logType(l.type), isPend = String(l.id).startsWith('pending-');
          return `<li class="flex gap-3">${avatar(m, 'w-8 h-8', 'text-[11px]')}
            <div class="flex-1 min-w-0 rounded-xl border border-slate-200 bg-white p-3">
              <div class="flex items-start justify-between gap-2">
                <div class="flex flex-wrap items-center gap-2 min-w-0"><span class="text-sm font-semibold text-slate-800">${esc(m ? m.name : 'Autor eliminado')}</span><span class="inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-[11px] font-semibold ${t.soft}"><i data-lucide="${t.icon}" class="w-3 h-3"></i>${t.label}</span>${isPend ? '<span class="text-[11px] text-amber-600 font-medium">Se guardará con la tarea</span>' : ''}</div>
                <button type="button" data-tl-del="${l.id}" class="p-1 rounded-md text-slate-300 hover:text-red-600 hover:bg-red-50 shrink-0" title="Eliminar registro"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
              </div>
              <p class="mt-1.5 text-sm text-slate-700 leading-relaxed whitespace-pre-wrap">${esc(l.text)}</p>
              <p class="mt-1.5 text-xs text-slate-400 flex items-center gap-1.5"><i data-lucide="clock" class="w-3.5 h-3.5"></i>${esc(fmtStamp(l.ts))}</p>
            </div></li>`;
        }).join('') : '<li class="text-center text-sm text-slate-400 py-8 border border-dashed border-slate-300 rounded-xl">Aún no hay seguimiento. Registra el primer avance, novedad o bloqueo.</li>';
        icons();
      };
      const addEntry = () => {
        const text = q('#tl-text').value.trim(), author = q('#tl-author').value, type = q('#tl-type').value, err = q('#tl-err');
        err.classList.add('hidden');
        if (!author) { err.textContent = 'Selecciona el autor del registro.'; err.classList.remove('hidden'); return false; }
        if (!text) { err.textContent = 'Escribe el detalle del registro.'; err.classList.remove('hidden'); return false; }
        UI.lastAuthor = author;
        if (editing) Store.addLog({ projectId: editing.projectId, taskId: editing.id, authorId: author, type, text });
        else pending.push({ id: 'pending-' + (++pendingSeq), authorId: author, type, text, ts: Date.now() });
        q('#tl-text').value = '';
        paintLogs();
        return true;
      };
      q('#tl-add').addEventListener('click', () => { if (addEntry()) { if (editing) { Toast.show('Seguimiento registrado'); App.render(); } } });
      q('#tl-list').addEventListener('click', async e => {
        const b = e.target.closest('[data-tl-del]'); if (!b) return;
        const lid = b.dataset.tlDel;
        if (lid.startsWith('pending-')) { const i = pending.findIndex(p => p.id === lid); if (i > -1) pending.splice(i, 1); paintLogs(); return; }
        if (await confirmDialog({ title: 'Eliminar registro', text: '¿Eliminar esta entrada del seguimiento?' })) { Store.deleteLog(lid); paintLogs(); App.render(); }
      });

      /* ---- Guardar / eliminar ---- */
      q('#task-form').addEventListener('submit', e => {
        e.preventDefault();
        const err = q('#tf-err'), title = q('#tf-title').value.trim();
        const fail = msg => { showTab('details'); err.textContent = msg; err.classList.remove('hidden'); q('#tf-title').classList.add('shake'); setTimeout(() => q('#tf-title').classList.remove('shake'), 350); };
        if (!title) { fail('El título es obligatorio.'); q('#tf-title').focus(); return; }
        if (selP.value === '__new__' || !selP.value) { fail('Elige un proyecto o crea uno nuevo.'); return; }
        if (selM.value === '__new__') { fail('Termina de añadir al responsable o elige otro.'); return; }
        if (q('#tl-text').value.trim() && q('#tl-author').value) addEntry();
        const data = {
          title, projectId: selP.value, companyId: selC.value, assigneeId: selM.value, due: q('#tf-due').value,
          priority: q('#tf-priority').value, status: q('#tf-status').value,
          tags: q('#tf-tags').value.split(',').map(s => s.trim()).filter(Boolean).slice(0, 6)
        };
        if (editing) {
          Store.updateTask(editing.id, data);
          Store.state.logs.forEach(l => { if (l.taskId === editing.id) l.projectId = data.projectId; });
          Store.save();
          Toast.show('Tarea actualizada');
        } else {
          const t = Store.addTask(data);
          pending.forEach(p => Store.addLog({ projectId: t.projectId, taskId: t.id, authorId: p.authorId, type: p.type, text: p.text, ts: p.ts }));
          Toast.show(pending.length ? `Tarea creada con ${pending.length} registro(s) de seguimiento` : 'Tarea creada');
        }
        Modal.closeEl(w); App.render();
      });
      const del = q('#tf-delete');
      if (del) del.addEventListener('click', async () => {
        const n = taskLogCount(editing.id);
        if (await confirmDialog({ title: 'Eliminar tarea', text: `¿Seguro que deseas eliminar "${editing.title}"${n ? ` y sus ${n} registro(s) de seguimiento` : ''}? Esta acción no se puede deshacer.` })) {
          Store.deleteTask(editing.id); Modal.closeEl(w); Toast.show('Tarea eliminada'); App.render();
        }
      });

      showTab(startTab); paintLogs();
      if (startTab === 'log') setTimeout(() => q('#tl-text').focus(), 60);
    }
  });
}

      <div><label class="lbl" for="mf-photo">URL de foto <span class="font-normal text-slate-400">(opcional)</span></label><input id="mf-photo" type="url" class="field" placeholder="https://…"><p class="text-xs text-slate-400 mt-1.5">Si la dejas vacía se mostrarán sus iniciales con color.</p></div>

function openProjectModal(id) {
  const editing = id ? Store.project(id) : null;
  const color = editing ? editing.color : PALETTE[Store.state.projects.length % PALETTE.length];
  Modal.open({
    title: editing ? 'Editar proyecto' : 'Nuevo proyecto', size: 'max-w-md',
    body: `<form id="project-form" class="space-y-4" novalidate>
      <div><label class="lbl" for="pf-name">Nombre *</label><input id="pf-name" class="field" maxlength="80" placeholder="Ej. Portal de clientes" value="${esc(editing?.name || '')}"><p id="pf-err" class="hidden text-xs text-red-600 mt-1.5"></p></div>
      <div><label class="lbl" for="pf-desc">Descripción</label><textarea id="pf-desc" rows="3" class="field resize-none" maxlength="300" placeholder="Objetivo o alcance del proyecto">${esc(editing?.description || '')}</textarea></div>
      <div><span class="lbl">Color</span><div class="flex flex-wrap gap-2" id="pf-colors">${PALETTE.map(c => `<label class="cursor-pointer"><input type="radio" name="pcolor" value="${c}" class="peer sr-only" ${c === color ? 'checked' : ''}><span class="block w-7 h-7 rounded-full ring-2 ring-transparent ring-offset-2 peer-checked:ring-slate-700 transition" style="background:${c}"></span></label>`).join('')}</div></div>
    </form>`,
    footer: `<button type="button" class="btn-ghost" data-modal-close>Cancelar</button><button type="submit" form="project-form" class="btn-primary"><i data-lucide="check" class="w-4 h-4"></i>${editing ? 'Guardar' : 'Crear proyecto'}</button>`,
    onMount: w => {
      w.querySelector('#project-form').addEventListener('submit', e => {
        e.preventDefault();
        const name = w.querySelector('#pf-name').value.trim(), err = w.querySelector('#pf-err');
        const dup = Store.state.projects.some(p => norm(p.name) === norm(name) && (!editing || p.id !== editing.id));
        if (!name) { err.textContent = 'El nombre es obligatorio.'; err.classList.remove('hidden'); return; }
        if (dup) { err.textContent = 'Ya existe un proyecto con ese nombre.'; err.classList.remove('hidden'); return; }
        const desc = w.querySelector('#pf-desc').value, col = (w.querySelector('input[name=pcolor]:checked') || {}).value || color;
        if (editing) { Store.updateProject(editing.id, { name, description: desc.trim(), color: col }); Toast.show('Proyecto actualizado'); }
        else { const p = Store.addProject(name, desc, col); Toast.show('Proyecto creado'); UI.view = 'project'; UI.projectId = p.id; UI.projectTab = 'tasks'; }
        Modal.closeEl(w); App.render();
      });
    }
  });
}

function openLogModal(projectId, taskId) {
  const S = Store.state;
  const task = taskId ? Store.task(taskId) : null;
  const pid = task ? task.projectId : (projectId || (S.projects[0] && S.projects[0].id) || '');
  const taskOpts = (proj, sel) => '<option value="">Sin tarea (general del proyecto)</option>' +
    S.tasks.filter(t => t.projectId === proj).map(t => `<option value="${t.id}" ${t.id === sel ? 'selected' : ''}>${esc(t.id + ' · ' + t.title)}</option>`).join('');
  Modal.open({
    title: 'Registrar en la bitácora', size: 'max-w-lg',
    body: `<form id="log-form" class="space-y-4" novalidate>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div><label class="lbl" for="lf-project">Proyecto</label><select id="lf-project" class="field">${selectOptions(S.projects, pid)}</select></div>
        <div><label class="lbl" for="lf-type">Tipo de registro</label><select id="lf-type" class="field">${LOG_TYPES.map(t => `<option value="${t.id}">${t.label}</option>`).join('')}</select></div>
      </div>
      <div><label class="lbl" for="lf-task">Tarea <span class="font-normal text-slate-400">(opcional)</span></label><select id="lf-task" class="field">${taskOpts(pid, taskId)}</select></div>
      <div><label class="lbl" for="lf-author">Autor</label><select id="lf-author" class="field">${selectOptions(S.members, UI.lastAuthor, { empty: 'Selecciona un autor…' })}</select></div>
      <div><label class="lbl" for="lf-text">Detalle del avance, novedad o bloqueo *</label><textarea id="lf-text" rows="5" class="field resize-none" maxlength="1500" placeholder="Describe qué se logró, qué cambió o qué está bloqueando el avance…"></textarea><p id="lf-err" class="hidden text-xs text-red-600 mt-1.5"></p></div>
      <p class="text-xs text-slate-400 flex items-center gap-1.5"><i data-lucide="clock" class="w-3.5 h-3.5"></i>La fecha y hora se registran automáticamente al guardar.</p>
    </form>`,
    footer: `<button type="button" class="btn-ghost" data-modal-close>Cancelar</button><button type="submit" form="log-form" class="btn-primary"><i data-lucide="send" class="w-4 h-4"></i>Guardar registro</button>`,
    onMount: w => {
      w.querySelector('#lf-project').addEventListener('change', e => { w.querySelector('#lf-task').innerHTML = taskOpts(e.target.value, ''); });
      w.querySelector('#log-form').addEventListener('submit', e => {
        e.preventDefault();
        const text = w.querySelector('#lf-text').value.trim(), author = w.querySelector('#lf-author').value, project = w.querySelector('#lf-project').value, err = w.querySelector('#lf-err');
        if (!project) { err.textContent = 'Crea un proyecto antes de registrar avances.'; err.classList.remove('hidden'); return; }
        if (!author) { err.textContent = 'Selecciona el autor del registro.'; err.classList.remove('hidden'); return; }
        if (!text) { err.textContent = 'Escribe el detalle del registro.'; err.classList.remove('hidden'); return; }
        UI.lastAuthor = author;
        Store.addLog({ projectId: project, taskId: w.querySelector('#lf-task').value, authorId: author, type: w.querySelector('#lf-type').value, text });
        Modal.closeEl(w); Toast.show('Registro añadido a la bitácora'); App.render();
      });
    }
  });
}

function openCompanyModal(id) {
  const editing = id ? Store.company(id) : null;
  let pendingLogo; /* undefined = sin cambios · '' = restablecer · data URL = nuevo logo */
  Modal.open({
    title: editing ? 'Editar espacio de trabajo' : 'Nueva empresa (espacio de trabajo)', size: 'max-w-md',
    body: `<form id="company-form" class="space-y-4" novalidate>
      <div><label class="lbl" for="cf-name">Nombre *</label><input id="cf-name" class="field" maxlength="80" placeholder="Ej. Nueva Inmobiliaria" value="${esc(editing ? editing.name : '')}"><p id="cf-err" class="hidden text-xs text-red-600 mt-1.5"></p></div>
      <div><label class="lbl" for="cf-desc">Descripción</label><textarea id="cf-desc" rows="3" class="field resize-none" maxlength="300" placeholder="Agregar descripción del espacio de trabajo">${esc(editing ? (editing.description || '') : '')}</textarea></div>

function exportExcel() {

  const inProject = UI.view === 'project' && Store.project(UI.projectId);
  const tasks = inProject ? Store.state.tasks.filter(t => t.projectId === UI.projectId) : filteredTasks();
  if (!tasks.length) { Toast.show('No hay tareas para exportar', 'error'); return; }
  const rows = sortTasks(tasks).slice().sort((a, b) => a.id.localeCompare(b.id)).map(t => ({
    'ID': t.id,
    'Proyecto': Store.project(t.projectId)?.name || '',
    'Empresa': Store.company(t.companyId)?.name || '',
    'Tarea': t.title,
    'Responsable': Store.member(t.assigneeId)?.name || 'Sin asignar',
    'Prioridad': prio(t.priority).label,
    'Estado': status(t.status).label,
    'Fecha Límite': t.due ? fmtFull(t.due) : ''
  }));
  const ws = XLSX.utils.json_to_sheet(rows, { header: ['ID', 'Proyecto', 'Empresa', 'Tarea', 'Responsable', 'Prioridad', 'Estado', 'Fecha Límite'] });
  ws['!cols'] = [{ wch: 8 }, { wch: 34 }, { wch: 28 }, { wch: 52 }, { wch: 26 }, { wch: 12 }, { wch: 14 }, { wch: 14 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Tareas');
  const ids = new Set(tasks.map(t => t.id));
  const logRows = Store.state.logs.filter(l => ids.has(l.taskId) || (inProject && l.projectId === UI.projectId)).sort((a, b) => a.ts - b.ts).map(l => {
    const tk = l.taskId ? Store.task(l.taskId) : null;
    return { 'Fecha': fmtStamp(l.ts), 'Proyecto': Store.project(l.projectId)?.name || '', 'Tarea': tk ? `${tk.id} · ${tk.title}` : '(General del proyecto)', 'Autor': Store.member(l.authorId)?.name || '', 'Tipo': logType(l.type).label, 'Detalle': l.text };
  });
  if (logRows.length) {
    const wl = XLSX.utils.json_to_sheet(logRows, { header: ['Fecha', 'Proyecto', 'Tarea', 'Autor', 'Tipo', 'Detalle'] });
    wl['!cols'] = [{ wch: 20 }, { wch: 30 }, { wch: 44 }, { wch: 24 }, { wch: 10 }, { wch: 80 }];
    XLSX.utils.book_append_sheet(wb, wl, 'Seguimiento');
  }
  const slug = inProject ? '_' + norm(Store.project(UI.projectId).name).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 30) : '';
  XLSX.writeFile(wb, `reporte_tareas${slug}_${todayISO()}.xlsx`);
  Toast.show(`Reporte exportado (${rows.length} tareas)`);
}

/* ============================ Nube en tiempo real (Firebase) ============================ */
const FB_VER = '10.14.1';
const COLLS = ['companies', 'projects', 'members', 'tasks', 'logs'];
const clean = o => JSON.parse(JSON.stringify(o));
const stable = v => JSON.stringify(v, (k, x) => (x && typeof x === 'object' && !Array.isArray(x)) ? Object.keys(x).sort().reduce((o, key) => { o[key] = x[key]; return o; }, {}) : x);
const friendly = e => {
  const c = e && e.code ? String(e.code) : '';
  if (c.includes('permission-denied')) return 'Sin permisos en la base de datos. Revisa las reglas de Firestore y que tu correo esté autorizado.';
  if (c.includes('unavailable') || c.includes('network')) return 'Sin conexión con el servidor.';
  if (c.includes('unauthorized-domain')) return 'Este dominio no está autorizado en Firebase Authentication.';
  return (e && e.message) ? e.message : 'Error desconocido.';
};

/* Implementación real: Firebase cargado como módulos ES desde el CDN oficial de Google */
const RealCloud = {
  configured() { return !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId && FIREBASE_CONFIG.appId); },
  async init() {
    const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
    const [app, auth, fs] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
    this.A = auth; this.F = fs;
    this.app = app.initializeApp(FIREBASE_CONFIG);
    this.auth = auth.getAuth(this.app);
    this.db = fs.getFirestore(this.app);
  },
  onAuth(cb) {
    return this.A.onAuthStateChanged(this.auth, u => cb(u ? { email: u.email || '', name: u.displayName || '', photo: u.photoURL || '', verified: !!u.emailVerified } : null));
  },
  async signIn() {
    const p = new this.A.GoogleAuthProvider();
    const params = { prompt: 'select_account' };
    if (ALLOWED_DOMAINS.length === 1 && !ALLOWED_EMAILS.length) params.hd = ALLOWED_DOMAINS[0];
    p.setCustomParameters(params);
    try { await this.A.signInWithPopup(this.auth, p); }
    catch (e) {
      if (e && (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment')) await this.A.signInWithRedirect(this.auth, p);
      else throw e;
    }
  },
  signOut() { return this.A.signOut(this.auth); },
  listen(coll, ok, fail) { const F = this.F; return F.onSnapshot(F.collection(this.db, coll), s => ok(s.docs.map(d => d.data())), fail); },
  listenMeta(ok, fail) { const F = this.F; return F.onSnapshot(F.doc(this.db, 'meta', 'init'), s => ok(s.exists()), fail); },
  async commit(ops) {
    const F = this.F;
    for (let i = 0; i < ops.length; i += 400) {
      const b = F.writeBatch(this.db);
      ops.slice(i, i + 400).forEach(o => { const ref = F.doc(this.db, o.coll, o.id); if (o.del) b.delete(ref); else b.set(ref, o.data); });
      await b.commit();
    }
  },
  seed(docs) {
    const F = this.F;
    return F.runTransaction(this.db, async tx => {
      const meta = F.doc(this.db, 'meta', 'init');
      const snap = await tx.get(meta);
      if (snap.exists()) return false;
      tx.set(meta, { seededAt: Date.now() });
      docs.forEach(o => tx.set(F.doc(this.db, o.coll, o.id), o.data));
      return true;
    });
  }
};
/* window.__FLOWDESK_CLOUD__ permite sustituir la nube en pruebas automáticas */
const Cloud = window.__FLOWDESK_CLOUD__ || RealCloud;

/* Sincronización: compara el estado local con lo último confirmado y envía solo las diferencias */
const Sync = {
  synced: {}, inflight: 0, renderTimer: null,
  reset() { COLLS.forEach(c => { this.synced[c] = new Map(); }); },
  applySnapshot(coll, docs) {
    if (coll === 'logs') docs.sort((a, b) => (b.ts || 0) - (a.ts || 0));
    else if (coll === 'tasks') docs.sort((a, b) => String(a.id).localeCompare(String(b.id)));
    else docs.sort((a, b) => (a.ord || 0) - (b.ord || 0));
    Store.state[coll] = docs;
    this.synced[coll] = new Map(docs.map(d => [d.id, stable(d)]));
    this.scheduleRender();
  },
  scheduleRender() {
    if (!Session.active) return;
    clearTimeout(this.renderTimer);
    this.renderTimer = setTimeout(() => { if (Store.state) App.render(); }, 60);
  },
  push() {
    const ops = [];
    COLLS.forEach(c => {
      const prev = this.synced[c], seen = new Set();
      Store.state[c].forEach(item => {
        const data = clean(item); seen.add(data.id);
        const s = stable(data);
        if (prev.get(data.id) !== s) { ops.push({ coll: c, id: data.id, data }); prev.set(data.id, s); }
      });
      [...prev.keys()].forEach(id => { if (!seen.has(id)) { ops.push({ coll: c, id, del: true }); prev.delete(id); } });
    });
    if (!ops.length) return;
    this.inflight++; Status.set('saving');
    Promise.resolve(Cloud.commit(ops))
      .then(() => { this.inflight--; if (!this.inflight) Status.set(navigator.onLine === false ? 'offline' : 'live'); })
      .catch(e => { this.inflight--; Status.set('error'); Toast.show('No se pudo guardar en la nube: ' + friendly(e), 'error'); });
  }
};

/* Sesión: autenticación, escucha en vivo y carga inicial */
const Session = {
  active: false, user: null, unsubs: [], denied: '', metaExists: false, authUnsub: null,
  async boot() {
    Gate.loading('Conectando…');
    if (!Cloud.configured()) { Gate.setup(); return; }
    try { await Cloud.init(); }
    catch (e) { Gate.error('No se pudo cargar Firebase. Revisa tu conexión a internet e inténtalo de nuevo.'); return; }
    if (this.authUnsub) { try { this.authUnsub(); } catch (e) { /* noop */ } }
    this.authUnsub = Cloud.onAuth(u => { if (u) this.start(u); else this.signedOut(); });
  },
  allowed(u) {
    const email = String(u.email || '').toLowerCase();
    if (!ALLOWED_EMAILS.length && !ALLOWED_DOMAINS.length) return !!email;
    if (ALLOWED_EMAILS.some(e => e.toLowerCase() === email)) return true;
    return ALLOWED_DOMAINS.some(d => email.endsWith('@' + d.toLowerCase()));
  },
  stop() {
    this.active = false; this.user = null;
    this.unsubs.forEach(fn => { try { fn(); } catch (e) { /* noop */ } });
    this.unsubs = [];
    Popover.close();
    Modal.stack.slice().forEach(w => Modal.closeEl(w));
    Store.state = null;
    Status.set('hidden');
    $('#user-btn').classList.add('hidden'); $('#user-btn').classList.remove('inline-flex');
  },
  signedOut() { this.stop(); const m = this.denied; this.denied = ''; Gate.login(m); },
  async start(user) {
    if (this.active && this.user && this.user.email === user.email) return;
    if (!this.allowed(user)) {
      this.denied = `La cuenta ${user.email} no tiene acceso a esta plataforma.`;
      try { await Cloud.signOut(); } catch (e) { this.signedOut(); }
      return;
    }
    this.stop(); this.user = user;
    Gate.loading('Cargando tus datos…');
    Store.mode = 'cloud'; Store.state = Store.empty(); Sync.reset();
    try {
      await new Promise((resolve, reject) => {
        const got = new Set();
        const mark = k => { got.add(k); if (got.size === COLLS.length + 1) resolve(); };
        const fail = e => { if (!this.active) reject(e); else { Status.set('error'); Toast.show(friendly(e), 'error'); } };
        COLLS.forEach(c => this.unsubs.push(Cloud.listen(c, docs => { Sync.applySnapshot(c, docs); mark(c); }, fail)));
        this.unsubs.push(Cloud.listenMeta(ex => { this.metaExists = ex; mark('meta'); }, fail));
      });
      if (!this.metaExists) await Cloud.seed(Store.seedDocs());
    } catch (e) { this.stop(); Gate.error(friendly(e)); return; }
    this.active = true;
    Gate.hide();
    this.paintUser();
    Status.set(navigator.onLine === false ? 'offline' : 'live');
    App.render();
  },
  paintUser() {
    const u = this.user, b = $('#user-btn'); if (!u) return;
    b.classList.remove('hidden'); b.classList.add('inline-flex');
    b.title = u.email;
    b.innerHTML = u.photo
      ? `<img src="${esc(u.photo)}" alt="" referrerpolicy="no-referrer" class="w-8 h-8 rounded-full object-cover" onerror="this.outerHTML='<span class=&quot;w-8 h-8 rounded-full bg-slate-700 text-white text-xs font-semibold inline-flex items-center justify-center&quot;>${esc(initials(u.name || u.email))}</span>'">`
      : `<span class="w-8 h-8 rounded-full bg-slate-700 text-white text-xs font-semibold inline-flex items-center justify-center">${esc(initials(u.name || u.email))}</span>`;
  },
  userMenu(anchor) {
    const u = this.user; if (!u) return;
    Popover.open(anchor, [
      { html: `<span class="min-w-0"><span class="block text-sm font-semibold text-slate-800 truncate">${esc(u.name || 'Mi cuenta')}</span><span class="block text-xs text-slate-500 truncate">${esc(u.email)}</span></span>` },
      { html: '<i data-lucide="log-out" class="w-4 h-4 text-slate-500"></i>Cerrar sesión', onClick: () => { Cloud.signOut().catch(e => Toast.show(friendly(e), 'error')); } }
    ], 270);
  }
};

  init() {
    Prefs.load();
    $('#brand-logo').src = BRAND_LOGO;
    this.bind();
    Session.boot();
  },
  populateFilters() {
    const S = Store.state;
    const fill = (id, key, items, label) => {
      const el = $(id);
      if (Filters[key] && !items.some(i => i.id === Filters[key])) Filters[key] = '';
      el.innerHTML = `<option value="">${label}</option>` + items.map(i => `<option value="${i.id}">${esc(i.name)}</option>`).join('');
      el.value = Filters[key];
    };
    fill('#f-project', 'project', S.projects, 'Todos los proyectos');
    fill('#f-member', 'member', S.members, 'Todos los responsables');
    if (Filters.company && !Store.company(Filters.company)) Filters.company = '';
  },
  renderTree() {
    const q = norm(UI.panelQuery);
    const projects = Store.state.projects.filter(p => !q || norm(p.name).includes(q));
    const homeActive = UI.view === 'home';
    $('#panel-tree').innerHTML =
      `<button type="button" data-action="nav" data-view="home" class="w-full flex items-center gap-2.5 rounded-lg px-3 py-2.5 text-sm text-left transition ${homeActive ? 'bg-indigo-100 text-slate-900 font-medium' : 'text-slate-700 hover:bg-slate-200/60'}"><i data-lucide="layout-grid" class="w-[18px] h-[18px] shrink-0"></i>Gestionar espacio de trabajo</button>` +
      projects.map(p => {
        const open = Store.state.tasks.filter(t => t.projectId === p.id && t.status !== 'done').length;
        const active = UI.view === 'project' && UI.projectId === p.id;
        return `<button type="button" data-action="open-project" data-id="${p.id}" title="${esc(p.name)}" class="w-full flex items-center gap-2.5 rounded-lg px-3 py-2.5 text-sm text-left transition ${active ? 'bg-indigo-100 text-slate-900 font-medium' : 'text-slate-700 hover:bg-slate-200/60'}">
          <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background:${esc(p.color)}"></span><span class="truncate flex-1">${esc(p.name)}</span>${open ? `<span class="text-[11px] text-slate-400">${open}</span>` : ''}</button>`;
      }).join('') +
      (q && !projects.length ? '<p class="px-3 py-3 text-xs text-slate-400">Sin resultados</p>' : '');
  },
  renderChrome() {
    const activeView = UI.view === 'project' ? 'projects' : UI.view;
    document.querySelectorAll('.rail-item[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === activeView));
    const c = Store.company(Filters.company);
    const wl = companyLogo(c);
    $('#ws-switch').title = c ? c.name : 'Todas las empresas';
    $('#ws-switch').innerHTML = wl
      ? `<img src="${esc(wl)}" alt="${esc(c.name)}" class="h-8 max-w-[170px] object-contain"><span class="flex-1"></span><i data-lucide="chevron-down" class="w-4 h-4 text-slate-500 shrink-0"></i>`
      : `${wsTile(c)}<span class="flex-1 min-w-0 truncate text-sm font-medium text-slate-800">${esc(c ? c.name : 'Todas las empresas')}</span><i data-lucide="chevron-down" class="w-4 h-4 text-slate-500 shrink-0"></i>`;
    $('#panel').classList.toggle('hidden', UI.collapsed);
    $('#panel-expand').classList.toggle('hidden', !UI.collapsed);
    $('#panel-search-wrap').classList.toggle('hidden', !UI.panelSearch);
    this.renderTree();
    const over = Store.state.tasks.filter(isOverdue).length;
    const badge = $('#bell-badge');
    badge.textContent = over > 99 ? '99+' : String(over);
    badge.classList.toggle('hidden', !over);
  },
  render() {
    if (!Store.state) return;
    this.populateFilters();
    this.renderChrome();
    const isHome = UI.view === 'home';
    const showFilters = ['board', 'list', 'calendar'].includes(UI.view);
    $('#view-header').classList.toggle('hidden', isHome);
    $('#filters-bar').classList.toggle('hidden', !showFilters);
    $('#f-clear').classList.toggle('hidden', !hasFilters());
    $('#view-switch').innerHTML = showFilters ? viewSwitchHTML() : '';
    const main = $('#main');
    main.className = isHome ? 'flex-1 overflow-auto bg-white' : 'flex-1 overflow-auto bg-slate-50 p-4 sm:p-6';
    const project = UI.view === 'project' ? Store.project(UI.projectId) : null;
    const company = Store.company(Filters.company);
    const pl = $('#page-logo'), plSrc = companyLogo(company);
    pl.classList.toggle('hidden', !(plSrc && showFilters));
    if (plSrc) { pl.src = plSrc; pl.alt = company.name; }
    $('#page-title').textContent = project ? project.name : VIEW_TITLES[UI.view] || 'Tablero';
    const total = Store.state.tasks.length;
    $('#page-sub').textContent = project ? 'Detalle del proyecto · tareas y bitácora'
      : showFilters ? `${company ? company.name + ' · ' : ''}${filteredTasks().length} de ${total} tareas${hasFilters() ? ' (filtradas)' : ''}`
      : UI.view === 'projects' ? `${company ? company.name + ' · ' : ''}${Store.state.projects.length} proyectos · elige vista Kanban o Lista`
      : UI.view === 'log' ? 'Historial de avances, novedades y bloqueos'
      : 'Administra responsables, proyectos y empresas';
    const html = { home: renderHome, projects: renderProjects, board: renderBoard, list: renderList, calendar: renderCalendar, log: renderLog, team: renderTeam, project: renderProject }[UI.view]();
    const st = main.scrollTop;
    main.innerHTML = html;
    main.scrollTop = st;
    icons();
  },
  setView(v) { UI.view = v; if (v !== 'project') UI.projectId = null; Popover.close(); this.render(); $('#main').scrollTop = 0; },
  bellMenu(anchor) {
    const over = Store.state.tasks.filter(isOverdue).sort((a, b) => a.due.localeCompare(b.due));
    const items = [{ html: `<span class="text-xs font-semibold uppercase tracking-wider text-slate-500">Tareas vencidas (${over.length})</span>` }]
      .concat(over.length
        ? over.slice(0, 8).map(t => ({ html: `<span class="w-2 h-2 rounded-full bg-red-500 shrink-0"></span><span class="truncate flex-1">${esc(t.title)}</span><span class="text-xs text-red-600 shrink-0">${fmtShort(t.due)}</span>`, onClick: () => openTaskModal(t.id) }))
        : [{ html: '<span class="text-sm text-slate-500">Todo al día: no hay tareas vencidas.</span>' }]);
    Popover.open(anchor, items, 320);
  },

  statusMenu(anchor, id) {
    const t = Store.task(id); if (!t) return;
    Popover.open(anchor, STATUSES.map(s => ({
      html: `<span class="w-2.5 h-2.5 rounded-full ${s.dot}"></span>${s.label}`, active: s.id === t.status,
      onClick: () => { Store.updateTask(id, { status: s.id }); Toast.show(`Movida a "${s.label}"`); App.render(); }
    })));
  },
  prioMenu(anchor, id) {
    const t = Store.task(id); if (!t) return;
    Popover.open(anchor, PRIORITIES.map(p => ({
      html: prioBadge(p.id), active: p.id === t.priority,
      onClick: () => { Store.updateTask(id, { priority: p.id }); App.render(); }
    })), 180);
  },
  assigneeMenu(anchor, id) {
    const t = Store.task(id); if (!t) return;
    const items = [{ html: `${avatar(null)}<span class="text-slate-500">Sin asignar</span>`, active: !t.assigneeId, onClick: () => { Store.updateTask(id, { assigneeId: '' }); App.render(); } }]
      .concat(Store.state.members.map(m => ({ html: `${avatar(m)}<span class="truncate">${esc(m.name)}</span>`, active: m.id === t.assigneeId, onClick: () => { Store.updateTask(id, { assigneeId: m.id }); App.render(); } })));
    Popover.open(anchor, items, 250);
  },

  bind() {
    const A = {
      'nav': el => App.setView(el.dataset.view),
      'toggle-panel': () => { UI.collapsed = !UI.collapsed; App.renderChrome(); icons(); },
      'panel-search': () => { UI.panelSearch = !UI.panelSearch; if (!UI.panelSearch) { UI.panelQuery = ''; $('#panel-q').value = ''; } App.renderChrome(); icons(); if (UI.panelSearch) $('#panel-q').focus(); },
      'panel-menu': el => Popover.open(el, [
        { html: '<i data-lucide="folder-plus" class="w-4 h-4 text-slate-500"></i>Nuevo proyecto', onClick: () => openProjectModal() },
        { html: '<i data-lucide="user-plus" class="w-4 h-4 text-slate-500"></i>Nuevo miembro', onClick: () => openMemberModal() },
        { html: '<i data-lucide="building-2" class="w-4 h-4 text-slate-500"></i>Nueva empresa', onClick: () => openCompanyModal() }
      ], 220),
      'ws-menu': el => {
        const items = [{ html: `${wsTile(null, 'w-7 h-7', 'text-xs', 'rounded-md')}<span class="truncate">Todas las empresas</span>`, active: !Filters.company, onClick: () => { Filters.company = ''; App.render(); } }]
          .concat(Store.state.companies.map(c => ({ html: `${wsTile(c, 'w-7 h-7', 'text-[10px]', 'rounded-md')}<span class="truncate">${esc(c.name)}</span>`, active: c.id === Filters.company, onClick: () => { Filters.company = c.id; App.render(); } })));
        Popover.open(el, items, Math.max(270, el.offsetWidth));
      },
      'ws-more': el => {
        const c = Store.company(Filters.company);
        const items = [];
        if (c) items.push({ html: '<i data-lucide="pencil" class="w-4 h-4 text-slate-500"></i>Editar espacio de trabajo', onClick: () => openCompanyModal(c.id) });
        items.push({ html: '<i data-lucide="building-2" class="w-4 h-4 text-slate-500"></i>Nueva empresa', onClick: () => openCompanyModal() });
        if (c) items.push({ html: '<i data-lucide="trash-2" class="w-4 h-4 text-red-500"></i><span class="text-red-600">Eliminar empresa</span>', onClick: () => deleteCompanyFlow(c.id) });
        Popover.open(el, items, 250);
      },
      'edit-company': () => { if (Filters.company) openCompanyModal(Filters.company); },
      'new-company': () => openCompanyModal(),
      'home-tab': el => { UI.homeTab = el.dataset.tab; App.render(); },
      'open-project-log': el => { UI.view = 'project'; UI.projectId = el.dataset.id; UI.projectTab = 'log'; App.render(); $('#main').scrollTop = 0; },
      'bell': el => App.bellMenu(el),
      'task-log': el => openTaskModal(el.dataset.id, { tab: 'log' }),
      'gate-signin': async () => { try { await Cloud.signIn(); } catch (e) { if (!/popup-closed|cancelled-popup/.test((e && e.code) || '')) Gate.login(friendly(e)); } },
      'gate-retry': () => Session.boot(),
      'gate-local': () => { Store.mode = 'local'; Store.loadLocal(); Gate.hide(); Status.set('local'); App.render(); },
      'user-menu': el => Session.userMenu(el),
      'projects-layout': el => { Prefs.set('projectsLayout', el.dataset.layout); App.render(); },
      'project-layout': el => { Prefs.set('projectLayout', el.dataset.layout); App.render(); },
      'help': () => openHelpModal(),
      'new-task': el => openTaskModal(null, { status: el.dataset.status, projectId: el.dataset.project || (UI.view === 'project' ? UI.projectId : '') }),
      'new-task-date': el => openTaskModal(null, { due: el.dataset.date }),
      'edit-task': el => openTaskModal(el.dataset.id),
      'card-menu': el => App.statusMenu(el, el.dataset.id),
      'status-menu': el => App.statusMenu(el, el.dataset.id),
      'prio-menu': el => App.prioMenu(el, el.dataset.id),
      'assignee-menu': el => App.assigneeMenu(el, el.dataset.id),
      'delete-task': async el => {
        const t = Store.task(el.dataset.id); if (!t) return;
        if (await confirmDialog({ title: 'Eliminar tarea', text: `¿Seguro que deseas eliminar "${t.title}"? Esta acción no se puede deshacer.` })) { Store.deleteTask(t.id); Toast.show('Tarea eliminada'); App.render(); }
      },
      'sort': el => { const k = el.dataset.key; if (UI.sort.key === k) { if (UI.sort.dir === 1) UI.sort.dir = -1; else UI.sort = { key: '', dir: 1 }; } else UI.sort = { key: k, dir: 1 }; App.render(); },
      'open-project': el => { UI.view = 'project'; UI.projectId = el.dataset.id; UI.projectTab = 'tasks'; App.render(); $('#main').scrollTop = 0; },
      'project-tab': el => { UI.projectTab = el.dataset.tab; App.render(); },
      'new-project': () => openProjectModal(),
      'edit-project': el => openProjectModal(el.dataset.id),
      'delete-project': async el => {
        const p = Store.project(el.dataset.id); if (!p) return;
        const n = Store.state.tasks.filter(t => t.projectId === p.id).length;
        if (await confirmDialog({ title: 'Eliminar proyecto', text: `Se eliminará "${p.name}" junto con sus ${n} tarea(s) y su bitácora. Esta acción no se puede deshacer.` })) {
          Store.deleteProject(p.id); UI.view = 'board'; UI.projectId = null; Toast.show('Proyecto eliminado'); App.render();
        }
      },
      'new-member': () => openMemberModal(),
      'delete-member': async el => {
        const m = Store.member(el.dataset.id); if (!m) return;
        if (await confirmDialog({ title: 'Eliminar miembro', text: `¿Eliminar a ${m.name}? Sus tareas quedarán sin asignar.` })) { Store.deleteMember(m.id); Toast.show('Miembro eliminado'); App.render(); }
      },
      'filter-member': el => { Filters.member = el.dataset.id; App.setView('list'); },
      'new-log': el => openLogModal(el.dataset.project || (UI.view === 'project' ? UI.projectId : UI.logProject)),
      'delete-log': async el => {
        if (await confirmDialog({ title: 'Eliminar registro', text: '¿Eliminar esta entrada de la bitácora?' })) { Store.deleteLog(el.dataset.id); Toast.show('Registro eliminado'); App.render(); }
      },
      'cal-prev': () => { UI.cal.m--; if (UI.cal.m < 0) { UI.cal.m = 11; UI.cal.y--; } App.render(); },
      'cal-next': () => { UI.cal.m++; if (UI.cal.m > 11) { UI.cal.m = 0; UI.cal.y++; } App.render(); },
      'cal-today': () => { const n = new Date(); UI.cal = { y: n.getFullYear(), m: n.getMonth() }; App.render(); },
      'export': exportExcel,
      'clear-filters': () => { Filters.q = ''; Filters.project = ''; Filters.member = ''; $('#f-q').value = ''; App.render(); }
    };

    document.addEventListener('click', e => {
      if (Popover.el && !Popover.el.contains(e.target)) Popover.close();
      const closer = e.target.closest('[data-modal-close]');
      if (closer) { const w = closer.closest('.fixed.inset-0.z-50'); if (w) Modal.closeEl(w); return; }
      const el = e.target.closest('[data-action]');
      if (el && A[el.dataset.action]) { e.preventDefault(); A[el.dataset.action](el, e); }
    });

    document.addEventListener('change', e => {
      const t = e.target;
      if (t.dataset.filter) { Filters[t.dataset.filter] = t.value; App.render(); return; }
      if (t.dataset.change === 'due') { Store.updateTask(t.dataset.id, { due: t.value }); App.render(); }
      else if (t.dataset.change === 'log-project') { UI.logProject = t.value; App.render(); }
    });

    $('#f-q').addEventListener('input', e => {
      Filters.q = e.target.value;
      if (!['board', 'list', 'calendar', 'projects'].includes(UI.view)) { UI.view = 'list'; UI.projectId = null; }
      App.render();
    });
    $('#panel-q').addEventListener('input', e => { UI.panelQuery = e.target.value; App.renderTree(); icons(); });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') { if (Popover.el) Popover.close(); else Modal.closeTop(); }
    });
    window.addEventListener('resize', () => Popover.close());
    window.addEventListener('offline', () => { if (Session.active) Status.set('offline'); });
    window.addEventListener('online', () => { if (Session.active) Status.set(Sync.inflight ? 'saving' : 'live'); });
    $('#main').addEventListener('scroll', () => Popover.close(), { passive: true });

    /* Arrastrar y soltar en el tablero */
    const main = $('#main');
    main.addEventListener('dragstart', e => {
      const card = e.target.closest('[data-card]'); if (!card) return;
      e.dataTransfer.setData('text/plain', card.dataset.card); e.dataTransfer.effectAllowed = 'move';
      setTimeout(() => card.classList.add('dragging'), 0);
    });
    main.addEventListener('dragend', () => { main.querySelectorAll('.dragging').forEach(c => c.classList.remove('dragging')); main.querySelectorAll('.drop-hot').forEach(c => c.classList.remove('drop-hot')); });
    main.addEventListener('dragover', e => {
      const col = e.target.closest('[data-col]'); if (!col) return;
      e.preventDefault(); e.dataTransfer.dropEffect = 'move';
      main.querySelectorAll('.drop-hot').forEach(c => { if (c !== col) c.classList.remove('drop-hot'); });
      col.classList.add('drop-hot');
    });
    main.addEventListener('dragleave', e => {
      const col = e.target.closest('[data-col]');
      if (col && !col.contains(e.relatedTarget)) col.classList.remove('drop-hot');
    });
    main.addEventListener('drop', e => {
      const col = e.target.closest('[data-col]'); if (!col) return;
      e.preventDefault();
      const id = e.dataTransfer.getData('text/plain'), t = Store.task(id);
      if (t && t.status !== col.dataset.col) { Store.updateTask(id, { status: col.dataset.col }); Toast.show(`Movida a "${status(col.dataset.col).label}"`); }
      App.render();
    });
  }
};

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => App.init());
else App.init();
})();
</script>
</body>
</html>
